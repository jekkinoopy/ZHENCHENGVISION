<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>編輯獎項 | 珍成視界 Admin</title>

    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../../css/style.css">
</head>

<body>

    <!-- 後台導覽列 -->
    <nav class="navbar navbar-expand-lg admin-navbar navbar-dark">
        <div class="container-fluid px-4">
            <a class="navbar-brand" href="../index.html">珍成視界 Admin</a>
            <div class="d-flex align-items-center gap-2">
                <a href="../../index.html" class="nav-link d-inline-flex align-items-center gap-1">
                    <i class="bi bi-box-arrow-up-left"></i> 回前台
                </a>
                <a href="../../index.html" class="btn btn-outline-light btn-sm ms-2">
                    <i class="bi bi-box-arrow-right"></i> 登出
                </a>
            </div>
        </div>
    </nav>

    <div class="container-fluid admin-shell">
        <div class="row">

            <!-- 側邊選單 -->
            <aside class="col-lg-2 admin-sidebar">
                <nav class="nav flex-column">
                    <a class="nav-link" href="../index.html"><i class="bi bi-speedometer2 me-2"></i>後台首頁</a>
                    <a class="nav-link" href="../photos/index.html"><i class="bi bi-images me-2"></i>攝影作品管理</a>
                    <a class="nav-link active" href="index.html"><i class="bi bi-trophy me-2"></i>獎項管理</a>
                    <span class="nav-link disabled"><i class="bi bi-tags me-2"></i>作品分類管理 <span class="admin-soon-badge">籌備中</span></span>
                    <span class="nav-link disabled"><i class="bi bi-megaphone me-2"></i>最新消息管理 <span class="admin-soon-badge">籌備中</span></span>
                    <span class="nav-link disabled"><i class="bi bi-gear me-2"></i>網站資訊管理 <span class="admin-soon-badge">籌備中</span></span>
                </nav>
            </aside>

            <!-- 主內容 -->
            <main class="col-lg-10 admin-main">
                <h1>編輯獎項</h1>
                <p class="text-muted mb-4" style="margin-top:-1rem;">此頁面以範例資料預先填入表單，模擬編輯「林麗珍・倒影之美」這筆獲獎紀錄。</p>

                <div class="admin-form-card">
                    <form action="index.html" method="get">
                        <div class="mb-3">
                            <label for="honorAuthor" class="form-label">作者</label>
                            <select class="form-select" id="honorAuthor" name="honorAuthor" required>
                                <option value="ko">柯志成</option>
                                <option value="lin" selected>林麗珍</option>
                            </select>
                        </div>

                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label for="honorYear" class="form-label">得獎年度</label>
                                <input type="number" class="form-control" id="honorYear" name="honorYear" value="2024" min="1990" max="2100">
                            </div>
                            <div class="col-md-8 mb-3">
                                <label for="honorCompetition" class="form-label">比賽名稱</label>
                                <input type="text" class="form-control" id="honorCompetition" name="honorCompetition" value="桃城映像攝影比賽" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="honorWork" class="form-label">作品名稱（選填）</label>
                            <input type="text" class="form-control" id="honorWork" name="honorWork" value="倒影之美">
                        </div>

                        <div class="mb-4">
                            <label for="honorTier" class="form-label">獎項名稱</label>
                            <select class="form-select" id="honorTier" name="honorTier" required>
                                <option value="gold">金牌獎</option>
                                <option value="silver">銀牌獎</option>
                                <option value="bronze">銅牌獎</option>
                                <option value="excellent">優勝獎</option>
                                <option value="selected-excellent">優選獎</option>
                                <option value="honorable" selected>佳作獎</option>
                                <option value="finalist">入選獎</option>
                                <option value="special">特別獎</option>
                            </select>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-dark px-4">儲存修改</button>
                            <a href="index.html" class="btn btn-outline-secondary px-4">取消並返回列表</a>
                        </div>
                    </form>
                </div>
            </main>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
