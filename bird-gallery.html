    <script src="gallery-mosaic.js"></script>

    <script>

        const FALLBACK_MANIFEST = {

            "gallery-birds": [
                "五色鳥001.jpg",
                "五色鳥002.jpg",
                "五色鳥003.jpg",
                "環頸雉001.jpg",
                "環頸雉002.jpg",
                "環頸雉003.jpg",
                "黑枕藍鶲001.jpg",
                "黑枕藍鶲002.jpg",
                "黑枕藍鶲003.jpg",
                "翠鳥001.jpg",
                "翠鳥002.jpg",
                "翠鳥003.jpg",
                "翠鳥004.jpg",
                "翠鳥005.jpg",
                "翠鳥006.jpg",
                "翠鳥007.jpg",
                "翠鳥008.jpg",
                "翠鳥009.jpg"
            ],

        };



        /**
         * 鳥種俗名／前綴 → 生活型「類群」（比目再上一層）
         * 規則：多個學術目可併成同一顆鈕（例：鴷形目與佛法僧目 → 攀禽類）
         */
        const SPECIES_TO_GROUP = {
            五色鳥: "攀禽類",
            台灣擬啄木: "攀禽類",
            啄木鳥: "攀禽類",
            小啄木: "攀禽類",
            翠鳥: "攀禽類",
            斑魚狗: "攀禽類",
            環頸雉: "雞雉類",
            竹雞: "雞雉類",
            黑枕藍鶲: "鳴禽類",
            棕背伯勞: "鳴禽類",
            台灣藍鵲: "鳴禽類",
            大冠鷲: "猛禽類",
            魚鷹: "猛禽類",
        };

        function groupForSpecies(species) {
            if (!species) return "其他";
            if (SPECIES_TO_GROUP[species]) return SPECIES_TO_GROUP[species];
            for (const [key, group] of Object.entries(SPECIES_TO_GROUP)) {
                if (species.includes(key)) return group;
            }
            return "其他";
        }

        let allBirdRecords = [];
        let activeGroup = "all";
        let activeSpecies = "all";

        function escapeAttr(s) {
            return String(s).replace(/&/g, "&amp;").replace(/"/g, "&quot;");
        }

        /** 目前類群範圍內的紀錄（用於列出鳥種） */
        function recordsInGroupScope() {
            if (activeGroup === "all") return allBirdRecords;
            return allBirdRecords.filter((r) => groupForSpecies(r.species) === activeGroup);
        }

        function filteredBirds() {
            let pool = allBirdRecords;
            if (activeGroup !== "all") pool = pool.filter((r) => groupForSpecies(r.species) === activeGroup);
            if (activeSpecies !== "all") pool = pool.filter((r) => r.species === activeSpecies);
            return pool;
        }

        function renderGroupFilters(records) {
            const host = document.getElementById("groupFilterList");
            const groups = [];
            records.forEach((r) => {
                const g = groupForSpecies(r.species);
                if (!g) return;
                let item = groups.find((x) => x.name === g);
                if (!item) {
                    item = { name: g, count: 0 };
                    groups.push(item);
                }
                item.count++;
            });
            const ORDER = ["攀禽類", "雞雉類", "鳴禽類", "猛禽類", "游禽類", "涉禽類", "其他"];
            groups.sort((a, b) => {
                const ia = ORDER.indexOf(a.name);
                const ib = ORDER.indexOf(b.name);
                if (ia === -1 && ib === -1) return a.name.localeCompare(b.name, "zh-Hant");
                if (ia === -1) return 1;
                if (ib === -1) return -1;
                return ia - ib;
            });
            host.innerHTML = [
                `<button class="species-chip ${activeGroup === "all" ? "active" : ""}" data-kind="group" data-group="all" type="button">全部 (${records.length})</button>`,
                ...groups.map(
                    ({ name, count }) =>
                        `<button class="species-chip ${activeGroup === name ? "active" : ""}" data-kind="group" data-group="${escapeAttr(name)}" type="button">${name} (${count})</button>`
                ),
            ].join("");
        }

        function renderSpeciesFilters() {
            const host = document.getElementById("speciesFilterList");
            const base = recordsInGroupScope();
            const names = Array.from(new Set(base.map((r) => r.species).filter(Boolean))).filter((n) => !String(n).startsWith("LINE_ALBUM"));
            names.sort((a, b) => a.localeCompare(b, "zh-Hant"));
            if (activeSpecies !== "all" && !names.includes(activeSpecies)) activeSpecies = "all";

            const rows = names.map((name) => ({
                name,
                count: base.filter((r) => r.species === name).length,
            }));

            host.innerHTML = [
                `<button class="species-chip species-chip-species ${activeSpecies === "all" ? "active" : ""}" data-kind="species" data-species="all" type="button">全部 (${base.length})</button>`,
                ...rows.map(
                    ({ name, count }) =>
                        `<button class="species-chip species-chip-species ${activeSpecies === name ? "active" : ""}" data-kind="species" data-species="${escapeAttr(name)}" type="button">${name} (${count})</button>`
                ),
            ].join("");
        }

        function renderAllFilters() {
            renderGroupFilters(allBirdRecords);
            renderSpeciesFilters();
        }

        /** 從網址 # 還原：#bird-gallery＝全部；#g=類群 & #s=鳥種（可單獨或併用，UTF-8 會編碼） */
        function normalizeBirdFiltersFromHash() {

            const raw = location.hash.replace(/^#/, "").trim();

            if (!raw || raw === "bird-gallery") {

                activeGroup = "all";

                activeSpecies = "all";

                return;

            }

            try {

                const sp = new URLSearchParams(raw);

                const gRaw = sp.get("g");

                const sRaw = sp.get("s");

                activeGroup =

                    gRaw != null && String(gRaw).trim() !== ""

                        ? String(gRaw).trim()

                        : "all";

                activeSpecies =

                    sRaw != null && String(sRaw).trim() !== ""

                        ? String(sRaw).trim()

                        : "all";

            } catch (e) {

                activeGroup = "all";

                activeSpecies = "all";

            }

        }

        function coerceBirdFiltersToValid() {

            const recs = allBirdRecords;

            if (!recs.length) return;

            const validGroups = new Set(recs.map((r) => groupForSpecies(r.species)));

            if (activeGroup !== "all" && !validGroups.has(activeGroup)) activeGroup = "all";

            let pool = recs;

            if (activeGroup !== "all") pool = pool.filter((r) => groupForSpecies(r.species) === activeGroup);

            const speciesInScope = new Set(pool.map((r) => r.species).filter(Boolean));

            if (activeSpecies !== "all" && !speciesInScope.has(activeSpecies)) {

                const existsAnywhere = recs.some((r) => r.species === activeSpecies);

                if (existsAnywhere) {

                    activeGroup = "all";

                    pool = recs;

                    if (!pool.some((r) => r.species === activeSpecies)) activeSpecies = "all";

                } else activeSpecies = "all";

            }

        }

        function syncBirdGalleryUrlHash() {

            try {

                let fragment;

                if (activeGroup === "all" && activeSpecies === "all") fragment = "#bird-gallery";

                else {

                    const p = new URLSearchParams();

                    if (activeGroup !== "all") p.set("g", activeGroup);

                    if (activeSpecies !== "all") p.set("s", activeSpecies);

                    fragment = `#${p.toString()}`;

                }

                history.replaceState(null, "", fragment);

            } catch (e) {

                /* ignore */

            }

        }

        function scrollBirdGallerySectionIntoView() {

            requestAnimationFrame(() => {

                const el = document.getElementById("bird-gallery");

                if (el) el.scrollIntoView({ block: "start", behavior: "auto" });

            });

        }

        function renderBirds() {

            const pool = filteredBirds();

            const use = pool.length ? pool : allBirdRecords;

            GalleryMosaic.renderGallery(document.getElementById("birdGalleryMount"), "gallery-birds", use.length ? use : allBirdRecords);

            syncBirdGalleryUrlHash();

        }

        document.getElementById("groupFilterList").addEventListener("click", (event) => {
            const btn = event.target.closest('[data-kind="group"]');
            if (!btn) return;
            activeGroup = btn.dataset.group || "all";
            activeSpecies = "all";
            renderAllFilters();
            renderBirds();
        });

        document.getElementById("speciesFilterList").addEventListener("click", (event) => {
            const btn = event.target.closest('[data-kind="species"]');
            if (!btn) return;
            activeSpecies = btn.dataset.species || "all";
            renderSpeciesFilters();
            renderBirds();
        });



        async function bootstrap() {

            let manifest;

            try {

                const res = await fetch("./gallery-manifest.json", { cache: "no-store" });

                if (!res.ok) throw new Error("manifest");

                manifest = await res.json();

            } catch {

                manifest = FALLBACK_MANIFEST;

            }

            const files = manifest["gallery-birds"] || FALLBACK_MANIFEST["gallery-birds"] || [];

            allBirdRecords = await GalleryMosaic.enrichOrientation(files.map(GalleryMosaic.parseBirdFile), "gallery-birds");

            normalizeBirdFiltersFromHash();

            coerceBirdFiltersToValid();

            renderAllFilters();

            renderBirds();

            scrollBirdGallerySectionIntoView();

        }

        window.addEventListener("hashchange", () => {

            normalizeBirdFiltersFromHash();

            coerceBirdFiltersToValid();

            renderAllFilters();

            renderBirds();

            scrollBirdGallerySectionIntoView();

            requestAnimationFrame(() => requestAnimationFrame(() => refreshLayouts()));

        });



        function refreshLayouts() {

            const mount = document.getElementById("birdGalleryMount");

            if (!mount) return;

            GalleryMosaic.syncSecondRowSizing(mount);

            GalleryMosaic.syncFourthRowSizing(mount);

        }



        bootstrap().then(() => {

            requestAnimationFrame(() => {

                refreshLayouts();

                requestAnimationFrame(() => refreshLayouts());

            });

        });

        window.addEventListener("resize", refreshLayouts);

    </script>
