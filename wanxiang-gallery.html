    <script src="gallery-mosaic.js"></script>

    <script>

        const FALLBACK_MANIFEST = {

            "gallery-culture": ["culture001.jpg", "culture002.jpg", "culture003.jpg"],

            "gallery-flora": ["flora001.jpg", "flora002.jpg", "flora003.jpg"],

            "gallery-insects": ["insects001.jpg", "insects002.jpg", "insects003.jpg"],

            "gallery-landscapes": ["landscapes001.jpg", "landscapes002.jpg", "landscapes003.jpg"],

        };



        const TAB_SLUG_TO_FOLDER = {

            culture: "gallery-culture",

            insects: "gallery-insects",

            landscapes: "gallery-landscapes",

            flora: "gallery-flora",

        };



        let categoryRecords = {};

        let activeSlug = "culture";



        function refreshLayouts() {

            const mount = document.getElementById("wanxiangGalleryMount");

            if (!mount || mount.querySelector(".empty-msg")) return;

            GalleryMosaic.syncSecondRowSizing(mount);

            GalleryMosaic.syncFourthRowSizing(mount);

        }



        function setActiveTab(slug, updateHash) {

            activeSlug = slug in TAB_SLUG_TO_FOLDER ? slug : "culture";

            document.querySelectorAll(".gallery-tab").forEach((b) => {

                b.classList.toggle("active", b.dataset.slug === activeSlug);

            });

            const folder = TAB_SLUG_TO_FOLDER[activeSlug];

            const records = categoryRecords[folder] || [];

            const mount = document.getElementById("wanxiangGalleryMount");

            if (!records.length) {

                mount.innerHTML = '<p class="empty-msg">此主題目前尚無影像。</p>';

            } else {

                GalleryMosaic.renderGallery(mount, folder, records, undefined, {

                    mosaicMin: 7,

                    /* 張數適用時優先拆成多段不重複版型；拆不開時仍會走單區馬賽克（ mosaicMin 之上） */

                    composeUniqueLayouts: true,

                    composeMinCount: 5,

                    composeMaxCount: 48,

                });

            }

            if (updateHash) location.hash = activeSlug;

            requestAnimationFrame(() => requestAnimationFrame(() => refreshLayouts()));

        }



        function applyHash() {

            const raw = (location.hash || "").replace(/^#/, "").toLowerCase();

            const slug = raw && TAB_SLUG_TO_FOLDER[raw] ? raw : "culture";

            setActiveTab(slug, false);

        }



        document.querySelectorAll(".gallery-tab").forEach((btn) => {

            btn.addEventListener("click", () => setActiveTab(btn.dataset.slug, true));

        });

        window.addEventListener("hashchange", applyHash);



        async function bootstrap() {

            let manifest;

            try {

                const res = await fetch("./gallery-manifest.json", { cache: "no-store" });

                if (!res.ok) throw new Error("manifest");

                manifest = await res.json();

            } catch {

                manifest = FALLBACK_MANIFEST;

            }

            const nonBirdFolders = Object.keys(TAB_SLUG_TO_FOLDER).map((s) => TAB_SLUG_TO_FOLDER[s]);

            const entries = await Promise.all(

                nonBirdFolders.map(async (folder) => {

                    const files = manifest[folder] || FALLBACK_MANIFEST[folder] || [];

                    const rec = await GalleryMosaic.enrichOrientation(files.map(GalleryMosaic.parseBirdFile), folder);

                    return [folder, rec];

                })

            );

            categoryRecords = Object.fromEntries(entries);

            applyHash();

        }



        bootstrap().then(() => {

            requestAnimationFrame(() => requestAnimationFrame(() => refreshLayouts()));

        });

        window.addEventListener("resize", refreshLayouts);

    </script>
