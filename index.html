    <div class="bottom-sign">ZHENCHENGVISION.COM</div>
    <script>
        function parseBirdFile(fileName) {
            const cleanName = fileName.replace(/\.[^/.]+$/, "");

            // 支援格式 1: 鳥名$$$照片名稱.jpg
            if (cleanName.includes("$$$")) {
                const parts = cleanName.split("$$$");
                const species = (parts[0] || "未分類").trim();
                const photoTitle = (parts[1] || parts[0] || "未命名照片").trim();
                return { species, photoTitle, fileName };
            }

            // 支援格式 2: 鳥名001.jpg / 鳥名_01.jpg
            const matched = cleanName.match(/^(.*?)[_\-\s]?(\d{1,4})$/);
            if (matched) {
                const species = (matched[1] || "未分類").trim();
                const photoTitle = `照片 ${matched[2]}`;
                return { species, photoTitle, fileName };
            }

            // 其他格式：整段視為鳥名
            const species = cleanName.trim() || "未分類";
            const photoTitle = "未命名照片";
            return { species, photoTitle, fileName };
        }

        function renderSpecies(records) {
            const speciesGrid = document.getElementById("speciesGrid");
            if (!records.length) {
                speciesGrid.innerHTML = '<p class="empty-msg">尚未載入圖片檔名，請把檔名加入 birdFiles。</p>';
                return;
            }

            const map = new Map();
            records.forEach((item) => {
                if (!map.has(item.species)) map.set(item.species, []);
                map.get(item.species).push(item);
            });

            speciesGrid.innerHTML = Array.from(map.entries())
                .map(([species, photos]) => {
                    const cover = photos[0];
                    return `
                        <article class="species-card">
                            <img src="images/bird/${cover.fileName}" alt="${species}">
                            <div class="species-meta">
                                <h3>${species}</h3>
                                <p>共 ${photos.length} 張照片</p>
                            </div>
                        </article>
                    `;
                })
                .join("");
        }

        function renderPhotos(records) {
            const photoGrid = document.getElementById("photoGrid");
            if (!records.length) {
                photoGrid.innerHTML = '<p class="empty-msg">尚未載入照片資料。</p>';
                return;
            }

            photoGrid.innerHTML = records
                .map((item, index) => {
                    const tileClass = `tile tile-${(index % 7) + 1}`;
                    return `
                        <article class="${tileClass}">
                            <img src="images/bird/${item.fileName}" alt="${item.species} - ${item.photoTitle}">
                        </article>
                    `;
                })
                .join("");
        }

        function renderThumbs(records) {
            const thumbStrip = document.getElementById("thumbStrip");
            if (!records.length) {
                thumbStrip.innerHTML = "";
                return;
            }

            thumbStrip.innerHTML = records.slice(0, 6)
                .map((item) => `<img src="images/bird/${item.fileName}" alt="${item.species} - ${item.photoTitle}">`)
                .join("");
        }

        async function bootstrapGallery() {
            try {
                const response = await fetch("./bird-manifest.json", { cache: "no-store" });
                if (!response.ok) throw new Error("manifest read failed");

                const birdFiles = await response.json();
                const records = birdFiles.map(parseBirdFile);

                renderSpecies(records);
                renderPhotos(records);
                renderThumbs(records);
            } catch (error) {
                const failMsg = '<p class="empty-msg">無法讀取 bird-manifest.json，請確認檔案存在且可存取。</p>';
                document.getElementById("speciesGrid").innerHTML = failMsg;
                document.getElementById("photoGrid").innerHTML = failMsg;
                document.getElementById("thumbStrip").innerHTML = "";
            }
        }

        bootstrapGallery();

        const tabButtons = document.querySelectorAll(".tab-btn");
        const tabPanels = document.querySelectorAll(".tab-panel");

        tabButtons.forEach((button) => {
            button.addEventListener("click", () => {
                const target = button.dataset.tab;

                tabButtons.forEach((btn) => btn.classList.remove("active"));
                tabPanels.forEach((panel) => panel.classList.remove("active"));

                button.classList.add("active");
                document.getElementById(target).classList.add("active");
            });
        });
    </script>
